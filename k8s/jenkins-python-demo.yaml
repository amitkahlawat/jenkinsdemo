apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-python-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins-python-demo
  template:
    metadata:
      labels:
        app: jenkins-python-demo
    spec:
      containers:
        - name: app
          image: jenkins-python-demo:main-v1.0.1-14
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-python-demo
spec:
  selector:
    app: jenkins-python-demo
  ports:
    - port: 8080
      targetPort: 8080
